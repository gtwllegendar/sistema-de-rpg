<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chronicles RPG - Gerenciador de Fichas (Tormenta20 & Ordem Paranormal)</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              tormenta: '#dc2626',
              ordem: '#10b981',
            }
          }
        }
      }
    }
  </script>
  <!-- Google Fonts & Custom CSS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Teko:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚔️</text></svg>">
</head>
<body class="bg-[#0a0e17] text-slate-100 min-h-screen flex flex-col selection:bg-red-500 selection:text-white">
  
  <div id="app" class="flex-1 flex flex-col">
    <!-- Renderizado dinamicamente pelo js/app.js -->
    <div class="min-h-screen flex items-center justify-center">
      <div class="text-center space-y-3">
        <div class="w-12 h-12 border-4 border-red-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
        <p class="text-sm text-slate-400 font-mono tracking-wider">CARREGANDO SISTEMA DE RPG...</p>
      </div>
    </div>
  </div>
  <!-- Script Principal Modular -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
